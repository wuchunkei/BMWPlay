name: Build BMWPlay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      # MFI_IDENTITY_PK8_B64 / MFI_CERTIFICATE_P7B_B64: base64 of offline-mfi/identity.pk8 and
      # certificate.p7b. With both set the APK can authenticate with an iPhone; without them
      # the build is source-only. DEBUG_KEYSTORE_B64 (optional) keeps the signature stable
      # so new builds install over old ones.
      - name: Build APK
        env:
          MFI_IDENTITY_PK8_B64: ${{ secrets.MFI_IDENTITY_PK8_B64 }}
          MFI_CERTIFICATE_P7B_B64: ${{ secrets.MFI_CERTIFICATE_P7B_B64 }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
          if [ -n "$MFI_IDENTITY_PK8_B64" ] && [ -n "$MFI_CERTIFICATE_P7B_B64" ]; then
            AUTH="$RUNNER_TEMP/auth"
            mkdir -p "$AUTH/offline-mfi"
            echo "$MFI_IDENTITY_PK8_B64" | base64 -d > "$AUTH/offline-mfi/identity.pk8"
            echo "$MFI_CERTIFICATE_P7B_B64" | base64 -d > "$AUTH/offline-mfi/certificate.p7b"
            DIPLAY_AUTH_ASSETS_DIR="$AUTH" ./gradlew :mobile:assembleStandaloneDebug --stacktrace
          else
            echo "::warning::No MFI secrets set; building a source-only APK that cannot authenticate with an iPhone."
            ./gradlew :mobile:assembleDebug --stacktrace
          fi
      - name: Rename APK
        run: |
          mkdir -p dist
          cp "$(find mobile/build/outputs/apk/debug -name '*.apk' | head -1)" dist/BMWPlay-0.2.12.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BMWPlay-0.2.12
          path: dist/BMWPlay-0.2.12.apk
