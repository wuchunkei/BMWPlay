name: Build BMWPlay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Build source-only APK
        run: ./gradlew :mobile:assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp "$(find mobile/build/outputs/apk/debug -name '*.apk' | head -1)" dist/BMWPlay-0.2.12.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BMWPlay-0.2.12
          path: dist/BMWPlay-0.2.12.apk
